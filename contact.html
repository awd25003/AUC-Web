<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>සම්බන්ධවන්න</title>
  <meta name="description" content="Ambalangoda Urban Council – official website / අම්බලන්ගොඩ නගර සභාව / அம்பலாங்கொடை நகர சபை">
  <link rel="icon" type="image/png" href="img/281961.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@300;400;500;600;700;800&family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css.css">
  <link rel="stylesheet" href="pro.css">
</head>
<body data-page="contact" data-title-key="c.title">
  <div id="site-header"></div>
  <main id="main-content">
    <section class="page-hero"><div class="container-xxl"><div class="page-hero-box reveal">
      <span class="section-mini" data-i18n="c.eyebrow"></span><h1 data-i18n="c.title"></h1><p data-i18n="c.sub"></p>
    </div></div></section>

    <section class="section-space"><div class="container-xxl"><div class="row g-4">
      <div class="col-lg-5">
        <div class="contact-info-card reveal">
          <h3 data-i18n="c.info"></h3>
          <div class="contact-line"><i class="fa-solid fa-location-dot"></i><div><strong data-i18n="c.address"></strong><p data-i18n="c.addrv"></p></div></div>
          <div class="contact-line"><i class="fa-solid fa-phone"></i><div><strong data-i18n="c.phone"></strong><p><a href="tel:+94912258275">+94 91 225 8275</a></p></div></div>
          <div class="contact-line"><i class="fa-solid fa-fax"></i><div><strong data-i18n="c.fax"></strong><p>+94 91 225 8285</p></div></div>
          <div class="contact-line"><i class="fa-solid fa-envelope"></i><div><strong data-i18n="c.email"></strong><p><a href="mailto:ambalangodauc@gmail.com">ambalangodauc@gmail.com</a></p></div></div>
          <div class="contact-line"><i class="fa-regular fa-clock"></i><div><strong data-i18n="c.hours"></strong><p data-i18n="c.hoursv"></p></div></div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="contact-form-card reveal">
          <h3 data-i18n="c.form"></h3>
          <form id="contactForm" class="row g-3" novalidate>
            <div class="col-md-6"><label class="form-label" for="cf-name" data-i18n="c.name"></label>
              <input id="cf-name" name="name" type="text" class="form-control premium-input" data-i18n-ph="c.yname" required autocomplete="name"></div>
            <div class="col-md-6"><label class="form-label" for="cf-email" data-i18n="c.email"></label>
              <input id="cf-email" name="email" type="email" class="form-control premium-input" data-i18n-ph="c.yemail" required autocomplete="email"></div>
            <div class="col-md-6"><label class="form-label" for="cf-phone" data-i18n="c.tel"></label>
              <input id="cf-phone" name="phone" type="tel" class="form-control premium-input" placeholder="07X XXX XXXX" autocomplete="tel"></div>
            <div class="col-md-6"><label class="form-label" for="cf-type" data-i18n="c.type"></label>
              <select id="cf-type" name="type" class="form-select premium-input">
                <option value="General" data-i18n="c.t1"></option><option value="Complaint" data-i18n="c.t2"></option>
                <option value="Suggestion" data-i18n="c.t3"></option><option value="Service request" data-i18n="c.t4"></option>
              </select></div>
            <div class="col-12"><label class="form-label" for="cf-subject" data-i18n="c.subject"></label>
              <input id="cf-subject" name="subject" type="text" class="form-control premium-input"></div>
            <div class="col-12"><label class="form-label" for="cf-msg" data-i18n="c.msg"></label>
              <textarea id="cf-msg" name="message" rows="5" class="form-control premium-input" data-i18n-ph="c.ymsg" required></textarea></div>
            <input type="text" name="_honey" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="col-12">
              <button type="submit" class="premium-submit-btn"><i class="fa-solid fa-paper-plane"></i> <span id="cf-btn-label" data-i18n="c.send"></span></button>
              <div id="cf-status" class="form-status" role="status" aria-live="polite"></div>
            </div>
          </form>
        </div>
      </div>
      <div class="col-12"><div class="map-card reveal">
        <iframe title="Map" src="https://www.google.com/maps?q=Ambalangoda%20Urban%20Council&output=embed" width="100%" height="380" style="border:0;" allowfullscreen loading="lazy"></iframe>
      </div></div>
    </div></div></section>
  </main>
  <div id="site-footer"></div>
  <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>
  <script src="i18n.js"></script>
  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script src="contact.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js.js"></script>
</body>
</html>
