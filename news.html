<head>

  <title>පුවත්</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<body data-page="news">

  <div id="site-header"></div>

<section class="page-hero">
  <div class="container-xxl">
    <div class="page-hero-box reveal">
      <span class="section-mini">Latest News</span>
      <h1>පුවත්</h1>
      <p>නවතම නිවේදන, සංවර්ධන වැඩසටහන් සහ නගර සභා පුවත්.</p>
    </div>
  </div>
</section>

<section class="section-space">
  <div class="container-xxl">

    <!-- NEWS GRID (JS will render here) -->
    <div class="row g-4" id="newsContainer"></div>

    <!-- PAGINATION -->
    <div class="pagination-wrap mt-5">
      <button id="prevBtn">Prev</button>
      <span id="pageNumbers"></span>
      <button id="nextBtn">Next</button>
    </div>

  </div>
</section>

<div id="site-footer"></div>
<button id="backToTop" class="back-to-top">
  <i class="fa-solid fa-arrow-up"></i>
</button>
              

  <div id="site-footer"></div>
  <button id="backToTop" class="back-to-top"><i class="fa-solid fa-arrow-up"></i></button>

  <!-- SCRIPTS -->
<script src="header.js"></script>
<script src="footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
