<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ගැලරිය</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css.css">
</head>
<body data-page="gallery">

  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container-xxl">
      <div class="page-hero-box reveal">
        <span class="section-mini">Gallery</span>
        <h1>ගැලරිය</h1>
        <p>අම්බලන්ගොඩ නගර සභාවේ විවිධ වැඩසටහන්, උත්සව සහ සංවර්ධන කටයුතු.</p>
      </div>
    </div>
  </section>

  <section class="section-space">
    <div class="container-xxl">
      <div class="section-title text-center reveal">
        <span class="section-mini">Image Collection</span>
        <h2>අපගේ විශේෂ ඡායාරූප එකතුව</h2>
        <p>නගර සභාවේ පසුගිය වැඩසටහන් සහ සංවර්ධන කටයුතු පිළිබඳ දර්ශන.</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-4 col-md-6">
          <div class="gallery-card reveal">
            <img src="hero1.jpg" alt="Gallery">
            <div class="gallery-overlay">
              <h4>නාගරික සංවර්ධන වැඩසටහන</h4>
            </div>
          </div>
        </div>

        <div class="col-lg-4 col-md-6">
          <div class="gallery-card reveal">
            <img src="hero2.jpg" alt="Gallery">
            <div class="gallery-overlay">
              <h4>ජනතා හමුව</h4>
            </div>
          </div>
        </div>

        <div class="col-lg-4 col-md-6">
          <div class="gallery-card reveal">
            <img src="hero3.jpg" alt="Gallery">
            <div class="gallery-overlay">
              <h4>පිරිසිදු නගර වැඩසටහන</h4>
            </div>
          </div>
        </div>

        <div class="col-lg-6 col-md-6">
          <div class="gallery-card large reveal">
            <img src="hero2.jpg" alt="Gallery">
            <div class="gallery-overlay">
              <h4>ප්‍රජා සහභාගීත්ව වැඩසටහන</h4>
            </div>
          </div>
        </div>

        <div class="col-lg-6 col-md-6">
          <div class="gallery-card large reveal">
            <img src="hero1.jpg" alt="Gallery">
            <div class="gallery-overlay">
              <h4>නව පහසුකම් ආරම්භ කිරීම</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <button id="backToTop" class="back-to-top"><i class="fa-solid fa-arrow-up"></i></button>

  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js.js"></script>
</body>
</html>
